apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend-ui
          image: empx
          imagePullPolicy: Never
          # env:
          #   - name: API_URL
          #     value: "/api"
          ports:
            - containerPort: 80
